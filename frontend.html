<!DOCTYPE html>
<html>
<head>
  <title>Deplit Editor</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

<header>
  <h1>Deplit Editor</h1>
</header>

<div class="editor-container">

  <p id="login-status" style="color:#1e90ff; margin-bottom:10px;">
    Not logged in.
  </p>

  <textarea id="editor">
<h1>Hello Deplit!</h1>
<p>This is your deployed page.</p>
  </textarea>

  <div style="margin-top:20px;">
    <button onclick="googleLogin()">Login with Google</button>
    <button onclick="deployCode()">Deploy</button>
    <button onclick="previewCode()">Preview</button>
  </div>

  <div class="output-box" id="output">
    Deployment output will appear here.
  </div>

</div>

<script src="deplit.js"></script>

</body>
</html>
