name: Deplit Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start backend
        run: |
          node -e "$(sed -n '/<script>/,/<\/script>/p' backend.html)"

      - name: Deploy frontend + index
        run: |
          mkdir -p /var/www/deplit
          cp index.html /var/www/deplit/index.html
          cp frontend.html /var/www/deplit/frontend.html
